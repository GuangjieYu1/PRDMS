[project]
name = "reqmesh-harness"
version = "0.1.0"
description = "reqmesh-harness: MCP tool layer for the reqmesh requirements management API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.10.0,<2",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
reqmesh-harness = "reqmesh_harness.cli:main"

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.25.0",
  "jsonschema>=4.20.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reqmesh_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
pythonpath = ["."]
markers = [
  "network: requires the live reqmesh instance (run with -m network)",
]
filterwarnings = [
  # UNSET 哨兵默认值刻意不进 JSON schema（区分「未提供」），pydantic 的警示可忽略
  "ignore:Default value UNSET is not JSON serializable.*:UserWarning",
]
